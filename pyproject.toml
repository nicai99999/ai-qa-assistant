[project]
name = "ai-qa-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "10_12", email = "chaoyi610@163.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.4.6",
    "langchain-deepseek>=1.1.1",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "pypdf>=6.21.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
]

[project.scripts]
ai-qa-assistant = "ai_qa_assistant:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
